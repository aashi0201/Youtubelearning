name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Submodule Dependencies
        run: |
          npm --prefix Youtubelearning/frontend install
          npm --prefix Youtubelearning/backend install

      - name: Run Build & Syntax Verification
        run: |
          npm --prefix Youtubelearning run check
